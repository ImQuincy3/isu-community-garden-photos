name: Convert garden HEIC photos to JPG
on:
  push:
    paths:
      - '**.HEIC'
      - '.github/workflows/convert-garden-photos.yml'
  workflow_dispatch:
jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pillow pillow-heif
      - name: Convert HEIC files
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from pillow_heif import register_heif_opener
          register_heif_opener()
          for source in sorted(Path('.').glob('*.HEIC')):
              target = source.with_suffix('.jpg')
              if not target.exists():
                  with Image.open(source) as image:
                      image.convert('RGB').save(target, 'JPEG', quality=88, optimize=True)
                  print(f'Created {target}')
          PY
      - name: Commit JPG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.jpg'
          if ! git diff --cached --quiet; then
            git commit -m "Convert garden HEIC photos to JPG for TimelineJS"
            git push
          fi
